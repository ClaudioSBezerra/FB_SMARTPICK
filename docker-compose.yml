services:
  # Backend (Go) — Traefik roteia /api/* direto pra cá
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    expose:
      - "8085"
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-fb_smartpick}?sslmode=disable
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - APP_MODULE=${APP_MODULE:-smartpick}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - APP_URL=${APP_URL:-https://smartpick.fbtax.cloud}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://smartpick.fbtax.cloud}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - api_uploads:/root/uploads
    networks:
      - fb_net
      - coolify

  # Frontend (React/Nginx) — rota pro Cloudflare Tunnel abaixo (labels
  # traefik.* removidos em 22/10: túnel validado e ativo desde 21/10 —
  # "smartpick.fbtax.cloud" e "smartpick.fbtax.cloud/^/api" nas Routes do
  # túnel fb-smartpick-prod).
  web:
    build:
      context: ./frontend
      args:
        - VITE_APP_MODULE=${VITE_APP_MODULE:-smartpick}
    restart: always
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - fb_net
      - coolify

  # Cloudflare Tunnel (21/10, ativado e validado em 22/10) — único caminho
  # público pra smartpick.fbtax.cloud agora (rotas no painel: hostname raiz
  # -> http://web:80, hostname+path ^/api -> http://api:8085).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fb_smartpick-cloudflared-prod
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - fb_net
    depends_on:
      - web

  # Banco de Dados
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-fb_smartpick}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fb_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cria a database se não existir (POSTGRES_DB só roda no init do volume vazio)
  db-init:
    image: postgres:15-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PGPASSWORD=${DB_PASSWORD:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_NAME=${DB_NAME:-fb_smartpick}
    restart: "no"
    command: >
      sh -c "
        psql -h db -U $$DB_USER -tc \"SELECT 1 FROM pg_database WHERE datname = '$$DB_NAME'\" | grep -q 1 ||
        psql -h db -U $$DB_USER -c \"CREATE DATABASE \\\"$$DB_NAME\\\"\"
      "
    networks:
      - fb_net

  # Redis
  redis:
    image: redis:alpine
    restart: always
    sysctls:
      - net.core.somaxconn=1024
    networks:
      - fb_net

networks:
  fb_net:
    driver: bridge
  coolify:
    external: true

volumes:
  postgres_data:
  api_uploads:
